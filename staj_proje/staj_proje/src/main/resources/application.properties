spring.application.name=staj_proje
# Sunucu Portu
server.port=8080

# H2 Test Veritabanı Bağlantı Ayarları
spring.datasource.url=jdbc:h2:mem:pdksdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Tarayıcıdan Veritabanını İzlemek İçin Konsol Aktivasyonu
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate Tablo Sihirbazı Ayarları
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true